name: Release
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: install Graphviz
        run: sudo apt-get install -y graphviz
      - name: Build and Test
        run: mvn -B -U package
      - name: Extract version
        id: get_version
        run: echo "version=$(basename -s .jar "$(ls ./target/*.jar)" | cut -d- -f2-)" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          files: ./target/*.jar
          draft: false
          prerelease: false
          generate_release_notes: true